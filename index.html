<script>
const CSV_URL = "COLA_AQUI_O_LINK_DA_SUA_PLANILHA_CSV";

function converterLinkDrive(link) {
  if(!link) return "";
  link = link.replace(/"/g, '').trim();
  const match = link.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
  return link;
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i], next = text[i+1];
    if (char === '"') {
      if (inQuotes && next === '"') { cell += '"'; i++; }
      else { inQuotes =!inQuotes; }
    } else if (char === ',' &&!inQuotes) {
      row.push(cell); cell = '';
    } else if ((char === '\n' || char === '\r') &&!inQuotes) {
      if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
      if (char === '\r' && next === '\n') i++;
    } else { cell += char; }
  }
  if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); }
  const headers = rows[0];
  return rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h.trim(), r[i]?.trim() || ''])));
}

async function carregarProdutos() {
    try {
        const res = await fetch(CSV_URL);
        const data = await res.text();
        const dados = parseCSV(data).filter(p => p['Produto']);

        const container = document.getElementById('lista-produtos');
        container.innerHTML = '';

        dados.forEach(produto => {
            const imagem = converterLinkDrive(produto['Imagem']);

            const card = `
                <div class="card-produto">
                    <img src="${imagem || `https://via.placeholder.com/400x220/000/FFD700?text=${encodeURIComponent(produto['Produto'])}`}" alt="${produto['Produto']}" onerror="this.src='https://via.placeholder.com/400x220/FF0000/FFFFFF?text=Erro+Imagem'">
                    <div class="card-conteudo">
                        <h3>${produto['Produto']}</h3>
                        <p>${produto['Descricao'] || 'iPhone Original com Garantia'}</p>
                        <div class="preco">R$ ${produto['Preco']}</div>
                        <button class="btn-comprar" onclick="window.open('https://wa.me/5551984254783?text=Olá! Tenho interesse no ${produto['Produto']} por R$ ${produto['Preco']}', '_blank')">Comprar no Whats</button>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });

        if(container.innerHTML === '') container.innerHTML = '<p>Nenhum produto encontrado.</p>'

    } catch (erro) {
        document.getElementById('lista-produtos').innerHTML = '<p>Erro ao carregar. Verifica se a planilha está publicada como CSV.</p>';
        console.error(erro);
    }
}

carregarProdutos();
</script>
