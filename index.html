<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PH Imports - Completo</title>
<style>
    /* ...mesmo CSS de antes... */
    .filtros{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap;}
    .filtro-btn{padding:10px 20px;background:rgba(255,215,0,0.1);border:1px solid #FFD700;color:#FFD700;border-radius:20px;cursor:pointer;}
    .filtro-btn.active{background:#FFD700;color:#000;}
    /* MODAL GALERIA */
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;align-items:center;justify-content:center;}
    .modal-content{display:flex;gap:10px;overflow-x:auto;padding:20px;}
    .modal-content img{height:400px;border-radius:15px;}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<header>
    <div class="logo"><img src="LOGO_PH.png"> PH IMPORTS</div>
    <button class="cart-btn">Carrinho (0)</button>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="trocarAba('pronta')">Pronta Entrega</button>
    <button class="tab-btn" onclick="trocarAba('encomenda')">Encomenda 30%</button>
</div>

<div class="filtros">
    <button class="filtro-btn active" onclick="filtrar('todos')">Todos</button>
    <button class="filtro-btn" onclick="filtrar('iphone')">iPhone</button>
    <button class="filtro-btn" onclick="filtrar('airpods')">AirPods</button>
    <button class="filtro-btn" onclick="filtrar('macbook')">MacBook</button>
    <button class="filtro-btn" onclick="filtrar('acessorios')">Acessórios</button>
</div>

<section class="produtos" id="produtos"></section>

<!-- MODAL GALERIA -->
<div class="modal" id="modalGaleria" onclick="fecharModal()">
    <div class="modal-content" id="galeriaImgs"></div>
</div>

<a href="https://wa.me/5551984254783" class="whats" target="_blank">💬</a>

<script>
const produtos = [
    // IPHONE
    {cat:'iphone', nome:'iPhone 16 Pro Max', gb:'512GB', cor:'Titânio Natural', preco:'R$ 7.200', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-16-pro-finish-select-202409-6-1inch-naturaltitanium?fmt=pjpg','https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-16-pro-finish-select-202409-6-1inch-naturaltitanium_AV1?fmt=pjpg'], tipo:'encomenda'},
    {cat:'iphone', nome:'iPhone 15 Pro', gb:'256GB', cor:'Titânio Azul', preco:'R$ 5.400', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-15-pro-finish-select-202309-6-1inch-bluetitanium?fmt=pjpg'], tipo:'pronta'},
    {cat:'iphone', nome:'iPhone 14', gb:'128GB', cor:'Roxo', preco:'R$ 3.800', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-14-finish-select-202209-6-1inch-purple?fmt=pjpg'], tipo:'pronta'},
    {cat:'iphone', nome:'iPhone 13', gb:'128GB', cor:'Meia-Noite', preco:'R$ 3.200', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-13-finish-select-202207-6-1inch-midnight?fmt=pjpg'], tipo:'pronta'},
    {cat:'iphone', nome:'iPhone 12', gb:'64GB', cor:'Branco', preco:'R$ 2.600', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-12-finish-select-202207-6-1inch-white?fmt=pjpg'], tipo:'pronta'},
    {cat:'iphone', nome:'iPhone 11', gb:'64GB', cor:'Preto', preco:'R$ 2.100', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-11-select-2019-family?fmt=pjpg'], tipo:'pronta'},
    {cat:'iphone', nome:'iPhone XS', gb:'256GB', cor:'Dourado', preco:'R$ 1.800', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-xs-select-2018?fmt=pjpg'], tipo:'pronta'},
    {cat:'iphone', nome:'iPhone X', gb:'64GB', cor:'Cinza Espacial', preco:'R$ 1.500', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-x-select-2017?fmt=pjpg'], tipo:'pronta'},
    
    // AIRPODS
    {cat:'airpods', nome:'AirPods Pro 2', preco:'R$ 1.400', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/MTJV3?fmt=pjpg'], tipo:'pronta'},
    {cat:'airpods', nome:'AirPods 3', preco:'R$ 980', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/MME73?fmt=pjpg'], tipo:'pronta'},
    
    // ACESSORIOS
    {cat:'acessorios', nome:'Carregador 20W', preco:'R$ 180', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/MHJ83?fmt=pjpg'], tipo:'pronta'},
    {cat:'acessorios', nome:'PowerBank MagSafe', preco:'R$ 650', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/MJWY3?fmt=pjpg'], tipo:'encomenda'},
    {cat:'acessorios', nome:'Cabo USB-C Lightning', preco:'R$ 120', imgs:['https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/MQKU3?fmt=pjpg'], tipo:'pronta'},
];

function renderizarProdutos(filtro='todos', aba='pronta'){
    const container = document.getElementById('produtos');
    container.innerHTML = '';
    produtos.filter(p => (filtro=='todos'||p.cat==filtro) && p.tipo==aba).forEach(p=>{
        container.innerHTML += `
        <div class="card">
            <img src="${p.imgs[0]}" onclick="abrirGaleria(${JSON.stringify(p.imgs)})">
            <h3>${p.nome}</h3>
            <p>${p.gb || ''} ${p.cor || ''}</p>
            <div class="preco">${p.preco}</div>
            <button class="btn-comprar" onclick="${p.tipo=='encomenda'?'encomendar':'comprar'}('${p.nome}')">
                ${p.tipo=='encomenda'?'Encomendar 30%':'Comprar Agora'}
            </button>
        </div>`;
    });
}

function abrirGaleria(imgs){
    const modal = document.getElementById('modalGaleria');
    const galeria = document.getElementById('galeriaImgs');
    galeria.innerHTML = imgs.map(i=>`<img src="${i}">`).join('');
    modal.style.display='flex';
}
function fecharModal(){document.getElementById('modalGaleria').style.display='none';}
function filtrar(cat){renderizarProdutos(cat); document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active');}
function trocarAba(aba){renderizarProdutos('todos', aba); document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active');}

// FUNÇÕES WHATS
function encomendar(produto){window.open(`https://wa.me/5551984254783?text=Olá PH! Quero ENCOMENDAR: ${produto}%0AQuero pagar 30% de sinal.`);}
function comprar(produto){window.open(`https://wa.me/5551984254783?text=Olá PH! Quero COMPRAR: ${produto}%0AForma de pagamento: Pix ou na Entrega`);}

renderizarProdutos(); // carrega inicial

// EFEITO PARTICULAS IGUAL ANTERIOR
const canvas = document.getElementById('particles'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight; let particles = []; for(let i=0; i<100; i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2,dx:(Math.random()-0.5)*0.5,dy:(Math.random()-0.5)*0.5});} function animate(){ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#FFD700';ctx.fill(); p.x+=p.dx;p.y+=p.dy; if(p.x<0||p.x>canvas.width)p.dx*=-1; if(p.y<0||p.y>canvas.height)p.dy*=-1;}); requestAnimationFrame(animate);} animate();
</script>
</body>
</html>
