<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH IMPORTS - iPhones Originais com Garantia</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif;scroll-behavior:smooth;}
    body{color:#fff; overflow-x:hidden;}

    /* VÍDEO DE FUNDO */
    #video-bg {position: fixed;top: 0;left: 0;width: 100%;height: 100%;object-fit: cover;z-index: -2;}
  .overlay {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0,0,0,0.6);z-index: -1;}

    /* HEADER */
    header{text-align: center;padding: 80px 20px 40px 20px;background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);}

    /* LETREIRO PH IMPORTS + MAÇÃ NOVA */
  .logo-text {
        font-size: 4rem;
        font-weight: 900;
        color: #FFD700;
        text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 30px rgba(255,215,0,0.8);
        display: inline-flex;
        align-items: center;
        gap: 15px;
        letter-spacing: 4px;
        animation: glowPulse 2s ease-in-out infinite;
    }
  .apple-icon {
        width: 50px;
        height: 50px;
        fill: #FFD700; /* força dourado direto */
        filter: drop-shadow(0 0 12px rgba(255,215,0,0.9));
    }
    @keyframes glowPulse {
        0%, 100% { text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 20px rgba(255,215,0,0.7); }
        50% { text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 40px rgba(255,215,0,1); }
    }

    /* SEÇÕES */
  .pilares,.produtos-section{max-width: 1200px;margin: 60px auto;padding: 40px 20px;text-align: center;background: rgba(0,0,0,0.4);border-radius: 20px;backdrop-filter: blur(8px);box-shadow: 0 8px 30px rgba(0,0,0,0.3);}

    /* PILARES LIMPOS E NA LINHA - SEM FUNDO */
  .grid-pilares{display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 20px; flex-wrap: wrap;}
  .pilar{font-weight:700;font-size:18px;color:#FFD700;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,0.5);}

    /* ABAS */
  .tabs{display:flex;justify-content:center;gap:15px;margin:30px 0;flex-wrap:wrap;}
  .tab-btn{padding:12px 25px;background:rgba(0,0,0,0.3);border:2px solid #FFD700;color:#FFD700;border-radius:30px;cursor:pointer;font-weight:bold;transition:0.3s;font-size:14px;backdrop-filter:blur(5px);}
  .tab-btn.active{background:#FFD700;color:#000;box-shadow:0 0 15px rgba(255,215,0,0.5);}
  .aba-conteudo{display:none;}
  .aba-conteudo.ativa{display:block;}

    /* PRONTA ENTREGA - CARROSSEL HORIZONTAL */
  .grid-pronta{display:flex;gap: 25px;overflow-x:auto;padding:20px 10px;scroll-snap-type:x mandatory;}
  .grid-pronta::-webkit-scrollbar{height:8px;}
  .grid-pronta::-webkit-scrollbar-thumb{background:#FFD700;border-radius:10px;}
  .grid-pronta.card-produto{min-width: 280px;scroll-snap-align:start;flex-shrink:0;}

    /* ENCOMENDAS - 2 COLUNAS VERTICAL */
  .grid-encomenda{display:grid;grid-template-columns:repeat(2, 1fr);gap: 30px;margin-top: 30px;}
  .aviso-encomenda{background:rgba(255,215,0,0.15);border:1px solid #FFD700;padding:15px;border-radius:12px;margin-bottom:25px;font-weight:600;}

    /* PRODUTOS */
  .card-produto{background: rgba(0,0,0,0.35);border-radius: 20px;overflow: hidden;box-shadow: 0 8px 25px rgba(0,0,0,0.4);transition: 0.3s;border: 1px solid rgba(255,215,0,0.2);backdrop-filter: blur(10px);text-align: left;}
  .card-produto:hover{transform: translateY(-10px);box-shadow: 0 15px 40px rgba(255,215,0,0.3);border-color: #FFD700;}
  .card-produto img{width: 100%;height: 220px;object-fit: contain;background: rgba(0,0,0,0.3);padding: 15px;display: block;}
  .card-conteudo{padding: 20px;}
  .card-produto h3{color: #FFD700; font-size: 1.5rem; margin-bottom: 8px;}
  .card-produto p{color: #ddd; margin-bottom: 15px; font-size: 14px;}
  .preco{font-size: 26px;font-weight:bold;margin:10px 0;color:#fff;}
  .sinal{font-size: 16px;color:#FFD700;font-weight:600;margin-bottom:10px;}
  .btn-comprar{display: inline-block;padding: 12px 20px;background: #FFD700;color: #000;text-decoration: none;border-radius: 25px;font-weight: bold;font-size: 1rem;transition: 0.3s;width: 100%;text-align: center;border: none;cursor: pointer;}
  .btn-comprar:hover{background: #FFC400; transform: scale(1.05);}
  .loading{text-align: center; padding: 40px; font-size: 1.2rem; color: #FFD700;}

    /* WHATS FLUTUANTE */
  .whats{position:fixed;bottom:20px;right:20px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;text-decoration:none;color:#fff;box-shadow:0 0 25px #25D366;z-index:99;}

    /* FOOTER SÓ COM CRÉDITOS */
    footer{text-align: center; padding: 25px; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);}
  .credito a{color:#25D366;font-weight:700;text-decoration:none;transition:0.3s;}
  .credito a:hover{text-decoration:underline;text-shadow:0 0 10px #25D366;}

    @media(max-width: 768px){
     .logo-text{font-size: 2.5rem; letter-spacing: 2px;}
     .apple-icon{width: 35px; height: 35px;}
     .pilar{font-size:16px;}
     .grid-pilares{gap:20px;}
     .grid-encomenda{grid-template-columns:1fr;}
    }
</style>
</head>
<body>

<!-- VÍDEO DE FUNDO -->
<video autoplay muted loop playsinline id="video-bg">
    <source src="estatua.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<header>
    <h1 class="logo-text">
        PH IMPORTS
        <!-- MAÇÃ NOVA SVG QUE FUNCIONA -->
        <svg class="apple-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
            <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1-52.6 16.4-67.9 34-15.8 17.7-29.7 46.3-25 72.1 29.2 2.3 49.7-32.8 68.9-33.6z"/>
        </svg>
    </h1>
</header>

<section class="pilares">
    <div class="grid-pilares">
        <div class="pilar">Confiança</div>
        <div class="pilar">Comprometimento</div>
        <div class="pilar">Profissionalismo</div>
    </div>
</section>

<section class="produtos-section">
    <div class="tabs">
        <button class="tab-btn active" onclick="abrirAba('pronta')">Pronta Entrega</button>
        <button class="tab-btn" onclick="abrirAba('encomenda')">Encomenda</button>
    </div>

    <!-- ABA PRONTA ENTREGA -->
    <div id="pronta" class="aba-conteudo ativa">
        <h2>Pronta Entrega</h2>
        <div class="grid-pronta" id="lista-pronta">
            <div class="loading">Carregando produtos...</div>
        </div>

    <!-- ABA ENCOMENDA -->
    <div id="encomenda" class="aba-conteudo">
        <h2>Encomenda</h2>
        <div class="aviso-encomenda">
            ⚠️ Encomenda mediante sinal de 30% do valor do produto
        </div>
        <div class="grid-encomenda" id="lista-encomenda">
            <div class="loading">Carregando produtos...</div>
        </div>
    </div>
</section>

<a href="https://wa.me/5551984254783" class="whats" target="_blank">💬</a>

<footer>
    <p class="credito">Desenvolvido por <a href="https://wa.me/SEU_NUMERO_AQUI" target="_blank">Edmilson Bittencourt</a></p>
</footer>

<script>
const CSV_URL = "COLA_AQUI_O_LINK_DA_SUA_PLANILHA_CSV";

function abrirAba(aba) {
    document.querySelectorAll('.aba-conteudo').forEach(el => el.classList.remove('ativa'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(aba).classList.add('ativa');
    event.target.classList.add('active');
}

function converterLinkDrive(link) {
  if(!link) return "";
  link = link.replace(/"/g, '').trim();
  const match = link.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
  return link;
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i], next = text[i+1];
    if (char === '"') {
      if (inQuotes && next === '"') { cell += '"'; i++; }
      else { inQuotes =!inQuotes; }
    } else if (char === ',' &&!inQuotes) {
      row.push(cell); cell = '';
    } else if ((char === '\n' || char === '\r') &&!inQuotes) {
      if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
      if (char === '\r' && next === '\n') i++;
    } else { cell += char; }
  }
  if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); }
  const headers = rows[0];
  return rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h.trim(), r[i]?.trim() || ''])));
}

async function carregarProdutos() {
    try {
        const res = await fetch(CSV_URL);
        const data = await res.text();
        const dados = parseCSV(data).filter(p => p['Produto']);

        const containerPronta = document.getElementById('lista-pronta');
        const containerEncomenda = document.getElementById('lista-encomenda');
        containerPronta.innerHTML = '';
        containerEncomenda.innerHTML = '';

        dados.forEach(produto => {
            const imagem = converterLinkDrive(produto['Imagem']);
            const preco = parseFloat(produto['Preco'].replace(',','.')) || 0;
            const sinal = (preco * 0.3).toFixed(2).replace('.',',');

            const card = `
                <div class="card-produto">
                    <img src="${imagem || `https://via.placeholder.com/400x220/000/FFD700?text=${encodeURIComponent(produto['Produto'])}`}" alt="${produto['Produto']}" onerror="this.src='https://via.placeholder.com/400x220/FF0000/FFFFFF?text=Erro+Imagem'">
                    <div class="card-conteudo">
                        <h3>${produto['Produto']}</h3>
                        <p>${produto['Descricao'] || 'iPhone Original com Garantia'}</p>
                        <div class="preco">R$ ${produto['Preco']}</div>
                        ${produto['Categoria'] === 'Encomenda'? `<div class="sinal">Sinal 30%: R$ ${sinal}</div>` : ''}
                        <button class="btn-comprar" onclick="window.open('https://wa.me/5551984254783?text=Olá! Tenho interesse no ${produto['Produto']} por R$ ${produto['Preco']}', '_blank')">Comprar no Whats</button>
                    </div>
                </div>
            `;

            if(produto['Categoria'] === 'Pronta Entrega'){
                containerPronta.innerHTML += card;
            } else if(produto['Categoria'] === 'Encomenda'){
                containerEncomenda.innerHTML += card;
            }
        });

        if(containerPronta.innerHTML === '') containerPronta.innerHTML = '<p>Nenhum produto em pronta entrega.</p>'
        if(containerEncomenda.innerHTML === '') containerEncomenda.innerHTML = '<p>Nenhum produto em encomenda.</p>'

    } catch (erro) {
        document.getElementById('lista-pronta').innerHTML = '<p>Erro ao carregar. Verifica se a planilha está publicada como CSV.</p>';
        console.error(erro);
    }
}

carregarProdutos();
</script>
