<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Imports - iPhones Originais com Garantia</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background:#000;color:#fff;overflow-x:hidden;}
    
    #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 50% 50%, #05051a 0%, #000 100%);}
    
    /* HEADER COM LOGO GRANDE EM TUDO */
    header{display:flex;justify-content:center;align-items:center;padding:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);position:relative;top:0;z-index:100;border-bottom:2px solid #FFD700;}
    .logo{width:100%;text-align:center;}
    .logo img{width:100%;height:120px;object-fit:contain;padding:10px 0;filter:drop-shadow(0 0 15px #FFD700);}
    .cart-btn{position:absolute;right:5%;background:#FFD700;color:#000;padding:10px 20px;border-radius:25px;border:none;cursor:pointer;font-weight:bold;font-size:14px;display:flex;gap:8px;align-items:center;}
    
    .banner{text-align:center;padding:60px 5% 40px 5%;}
    .banner h1{display:none;} /* REMOVIDO */
    .banner p{display:none;} /* REMOVIDO */
    .pilares{display:flex;flex-direction:column;gap:15px;margin-top:10px;max-width:400px;margin-left:auto;margin-right:auto;}
    .pilar{background:rgba(20,20,20,0.6);border:1px solid #FFD700;padding:18px 20px;border-radius:15px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(5px);}
    
    .tabs{display:flex;justify-content:center;gap:15px;margin:30px 5%;flex-wrap:wrap;}
    .tab-btn{padding:12px 25px;background:transparent;border:2px solid #FFD700;color:#FFD700;border-radius:30px;cursor:pointer;font-weight:bold;transition:0.3s;font-size:14px;}
    .tab-btn.active{background:#FFD700;color:#000;}
    
    .produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:0 5% 80px 5%;}
    .card{background:rgba(255,255,255,0.05);border-radius:20px;padding:20px;transition:0.3s;border:1px solid rgba(255,215,0,0.2);position:relative;}
    .card:hover{transform:translateY(-8px);border-color:#FFD700;box-shadow:0 0 25px rgba(255,215,0,0.3);}
    .card img{width:100%;height:220px;object-fit:contain;background:rgba(0,0,0,0.3);border-radius:15px;margin-bottom:15px;padding:10px;}
    .card h3{color:#FFD700;margin-bottom:5px;font-size:20px;}
    .card p{color:#aaa;font-size:14px;margin-bottom:10px;}
    .preco{font-size:24px;font-weight:bold;margin:10px 0;color:#fff;}
    .btns-card{display:flex;gap:10px;}
    .btn-comprar, .btn-add{flex:1;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;font-size:14px;transition:0.2s;}
    .btn-comprar{background:#FFD700;color:#000;}
    .btn-comprar:hover{background:#FFC400;}
    .btn-add{background:transparent;color:#FFD700;border:2px solid #FFD700;}
    .btn-add:hover{background:#FFD700;color:#000;}
    
    /* MODAL CARRINHO MEIA TELA */
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:200;}
    .modal-content{background:#111;margin:0 auto;padding:20px;border-radius:20px 20px 0 0;border:2px solid #FFD700;border-bottom:none;position:absolute;bottom:0;width:100%;max-height:50vh;overflow-y:auto;} /* 50% da tela */
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .modal-header h2{color:#FFD700;}
    .btn-x{background:none;border:none;color:#FFD700;font-size:28px;cursor:pointer;line-height:1;}
    .item-carrinho{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:10px;background:rgba(255,255,255,0.05);border-radius:10px;}
    .item-info{flex:1;}
    .item-info h4{color:#FFD700;font-size:14px;}
    .item-info p{color:#aaa;font-size:12px;}
    .qtd{display:flex;gap:8px;align-items:center;}
    .qtd button{background:#FFD700;color:#000;border:none;width:25px;height:25px;border-radius:50%;cursor:pointer;font-weight:bold;}
    .total{font-size:22px;font-weight:bold;color:#FFD700;text-align:right;margin:20px 0;border-top:1px solid #FFD700;padding-top:15px;}
    .btn-fechar, .btn-finalizar, .btn-continuar, .btn-esvaziar{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer;}
    .btn-finalizar{background:#FFD700;color:#000;}
    .btn-continuar{background:transparent;color:#FFD700;border:2px solid #FFD700;}
    .btn-esvaziar{background:#800;color:#fff;}
    
    /* FORM CHECKOUT */
    .modal-checkout .modal-content{max-height:90vh;}
    .form-group{margin-bottom:15px;}
    .form-group label{display:block;margin-bottom:5px;color:#FFD700;font-size:14px;}
    .form-group input, .form-group select{width:100%;padding:12px;border-radius:8px;border:1px solid #FFD700;background:#222;color:#fff;}
    .pagamento-opcoes{display:flex;flex-direction:column;gap:10px;margin:20px 0;}
    .pagamento-opcoes label{background:rgba(255,255,255,0.05);padding:12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;}
    .qr-code{width:200px;height:200px;background:#fff;margin:10px auto;display:none;border-radius:10px;}
    .copiar-pix{background:#222;border:1px solid #FFD700;color:#FFD700;padding:10px;border-radius:8px;width:100%;margin-top:10px;cursor:pointer;}
    
    .whats{position:fixed;bottom:20px;right:20px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;text-decoration:none;color:#fff;box-shadow:0 0 25px #25D366;z-index:99;}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<header>
    <div class="logo">
        <img src="LOGO_PH.png" alt="PH Imports"> <!-- Logo ocupando tudo -->
    </div>
    <button class="cart-btn" onclick="abrirCarrinho()">🛒 Carrinho (<span id="qtd-carrinho">0</span>)</button>
</header>

<section class="banner">
    <div class="pilares">
        <div class="pilar">📦 Produtos de procedência</div>
        <div class="pilar">💳 Pix, boleto e cartão</div>
        <div class="pilar">🚚 Entrega segura</div>
    </div>
</section>

<div class="tabs">
    <button class="tab-btn active" onclick="trocarAba('pronta', this)">Pronta Entrega</button>
    <button class="tab-btn" onclick="trocarAba('encomenda', this)">Encomenda 30%</button>
</div>

<section class="produtos" id="produtos"></section>

<a href="https://wa.me/5551995702188" class="whats" target="_blank">💬</a>

<!-- MODAL CARRINHO -->
<div id="modal-carrinho" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🛒 Seu Carrinho</h2>
            <button class="btn-x" onclick="fecharCarrinho()">×</button>
        </div>
        <div id="lista-carrinho"></div>
        <div class="total">Total: R$ <span id="total-carrinho">0,00</span></div>
        <button class="btn-finalizar" onclick="abrirCheckout()">🛒 Finalizar Compra 🛒</button>
        <button class="btn-continuar" onclick="fecharCarrinho()">Continuar Comprando</button>
        <button class="btn-esvaziar" onclick="esvaziarCarrinho()">Esvaziar Carrinho</button>
    </div>
</div>

<!-- MODAL CHECKOUT -->
<div id="modal-checkout" class="modal modal-checkout">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Finalizar Pedido</h2>
            <button class="btn-x" onclick="fecharCheckout()">×</button>
        </div>
        <div class="form-group"><label>Nome Completo</label><input type="text" id="nome"></div>
        <div class="form-group"><label>WhatsApp</label><input type="text" id="whats"></div>
        <div class="form-group"><label>Endereço Completo</label><input type="text" id="endereco"></div>
        <div class="form-group"><label>Forma de Pagamento</label>
            <div class="pagamento-opcoes">
                <label><input type="radio" name="pagamento" value="pix" onchange="mostrarPix()"> PIX - QR Code</label>
                <label><input type="radio" name="pagamento" value="boleto" onchange="esconderPix()"> Boleto - Mediante Análise</label>
                <label><input type="radio" name="pagamento" value="cartao" onchange="esconderPix()"> Cartão - Na Entrega</label>
            </div>
        </div>
        <div id="area-pix">
            <p style="text-align:center;color:#FFD700;">Sinal de 30%: R$ <span id="valor-sinal">0,00</span></p>
            <img id="qr-code" class="qr-code" src="" alt="QR Code PIX">
            <input type="text" id="pix-copia-cola" readonly style="display:none;width:100%;padding:10px;background:#222;border:1px solid #FFD700;color:#fff;border-radius:8px;margin-top:10px;">
            <button class="copiar-pix" onclick="copiarPix()">Copiar Código PIX</button>
        </div>
        <button class="btn-finalizar" onclick="finalizarPedido()">🛒 Confirmar Pedido 🛒</button>
    </div>
</div>

<script>
let carrinho = [];
let numeroPedido = parseInt(localStorage.getItem('numeroPedido') || '1');
const NUMERO_PH = "5551995702188"; // NOVO NUMERO
const NOME_PIX = "Edmilson Ricardo de Mello Bittencourt Junior";
const CHAVE_PIX = "60055624014"; // CPF NUBANK

const produtos = [
    // PRODUTO TESTE
    {nome:'iPhone TESTE', desc:'R$ 0,10 - Para teste de pagamento', preco:0.10, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-15-pro-finish-select-202309-6-1inch-naturaltitanium?wid=5120&fmt=pjpg', tipo:'pronta'},
    {nome:'iPhone TESTE ENCOMENDA', desc:'R$ 0,10 - Para teste 30%', preco:0.10, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-16-pro-finish-select-202409-6-1inch-deserttitanium?wid=5120&fmt=pjpg', tipo:'encomenda'},
    
    // PRONTA ENTREGA
    {nome:'iPhone 15 Pro Max', desc:'512GB - Titânio Natural', preco:7200, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-15-pro-finish-select-202309-6-1inch-naturaltitanium?wid=5120&fmt=pjpg', tipo:'pronta'},
    {nome:'iPhone 15 Pro', desc:'256GB - Titânio Azul', preco:5400, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-15-pro-finish-select-202309-6-1inch-bluetitanium?wid=5120&fmt=pjpg', tipo:'pronta'},
    {nome:'iPhone 14', desc:'128GB - Roxo', preco:3800, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-14-finish-select-202209-6-1inch-purple?wid=5120&fmt=pjpg', tipo:'pronta'},

    // ENCOMENDA 30%
    {nome:'iPhone 16 Pro Max', desc:'1TB - Titânio Deserto', preco:8500, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-16-pro-finish-select-202409-6-1inch-deserttitanium?wid=5120&fmt=pjpg', tipo:'encomenda'},
];

function formatarPreco(valor){ return valor.toLocaleString('pt-BR', {minimumFractionDigits: 2}); }

function renderizarProdutos(tipo){
    const container = document.getElementById('produtos');
    container.innerHTML = '';
    produtos.filter(p => p.tipo == tipo).forEach(p=>{
        const btnComprar = tipo=='encomenda' ? 'Encomendar 30%' : 'Comprar Agora';
        container.innerHTML += `
        <div class="card">
            <img src="${p.img}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <p>${p.desc}</p>
            <div class="preco">R$ ${formatarPreco(p.preco)}</div>
            <div class="btns-card">
                <button class="btn-comprar" onclick="comprarDireto('${p.nome}', '${p.desc}', ${p.preco})">${btnComprar}</button>
                <button class="btn-add" onclick="adicionarCarrinho('${p.nome}', '${p.desc}', ${p.preco})">Add</button>
            </div>
        </div>`;
    });
}

function comprarDireto(nome, desc, preco){
    carrinho = [{nome, desc, preco, qtd:1}]; // Limpa e adiciona só 1
    atualizarCarrinho();
    abrirCheckout();
}

function adicionarCarrinho(nome, desc, preco){
    const item = carrinho.find(i => i.nome == nome);
    if(item){ item.qtd++; } 
    else { carrinho.push({nome, desc, preco, qtd:1}); }
    atualizarCarrinho();
    abrirCarrinho();
}

function removerCarrinho(nome){
    const item = carrinho.find(i => i.nome == nome);
    if(item.qtd > 1){ item.qtd--; } 
    else { carrinho = carrinho.filter(i => i.nome != nome); }
    atualizarCarrinho();
}

function esvaziarCarrinho(){
    carrinho = [];
    atualizarCarrinho();
}

function atualizarCarrinho(){
    document.getElementById('qtd-carrinho').innerText = carrinho.reduce((t,i)=>t+i.qtd,0);
    const lista = document.getElementById('lista-carrinho');
    lista.innerHTML = '';
    let total = 0;
    carrinho.forEach(i=>{
        total += i.preco * i.qtd;
        lista.innerHTML += `
        <div class="item-carrinho">
            <div class="item-info">
                <h4>${i.nome}</h4>
                <p>R$ ${formatarPreco(i.preco)} x ${i.qtd}</p>
            </div>
            <div class="qtd">
                <button onclick="removerCarrinho('${i.nome}')">-</button>
                <span>${i.qtd}</span>
                <button onclick="adicionarCarrinho('${i.nome}', '${i.desc}', ${i.preco})">+</button>
            </div>
        </div>`;
    });
    document.getElementById('total-carrinho').innerText = formatarPreco(total);
    const sinal = total * 0.3;
    document.getElementById('valor-sinal').innerText = formatarPreco(sinal);
}

function abrirCarrinho(){ document.getElementById('modal-carrinho').style.display='block'; }
function fecharCarrinho(){ document.getElementById('modal-carrinho').style.display='none'; }
function abrirCheckout(){ 
    if(carrinho.length==0){ alert('Carrinho vazio'); return; }
    fecharCarrinho(); 
    document.getElementById('modal-checkout').style.display='block'; 
}
function fecharCheckout(){ document.getElementById('modal-checkout').style.display='none'; }

function gerarPayloadPix(valor){
    // Payload PIX simplificado para QR Code
    return `00020126580014br.gov.bcb.pix0136${CHAVE_PIX}5204000053039865802BR5925${NOME_PIX}6009SAO PAULO62070503***6304`;
}

function mostrarPix(){
    document.getElementById('area-pix').style.display='block';
    const total = carrinho.reduce((t,i)=>t+i.preco*i.qtd,0);
    const sinal = total * 0.3;
    const valor = sinal.toFixed(2);
    
    const payload = `PIX:${CHAVE_PIX}:${valor}:${NOME_PIX}`;
    document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(payload)}`;
    document.getElementById('qr-code').style.display='block';
    document.getElementById('pix-copia-cola').value = payload;
    document.getElementById('pix-copia-cola').style.display='block';
}
function esconderPix(){ document.getElementById('area-pix').style.display='none'; }

function copiarPix(){
    const input = document.getElementById('pix-copia-cola');
    input.select();
    document.execCommand('copy');
    alert('Código PIX copiado!');
}

function finalizarPedido(){
    const nome = document.getElementById('nome').value;
    const whats = document.getElementById('whats').value;
    const endereco = document.getElementById('endereco').value;
    const pagamento = document.querySelector('input[name="pagamento"]:checked');
    
    if(!nome || !whats || !endereco || !pagamento){ alert('Preencha todos os dados'); return; }
    
    const total = carrinho.reduce((t,i)=>t+i.preco*i.qtd,0);
    const itens = carrinho.map(i=>`${i.nome} - ${i.qtd}x R$${formatarPreco(i.preco)}`).join('\n');
    const pedidoNum = numeroPedido;
    numeroPedido++;
    localStorage.setItem('numeroPedido', numeroPedido);
    
    let msg = `🛒 PEDIDO Nº ${pedidoNum} 🛒\n\n`;
    msg += `Nome: ${nome}\nWhatsApp: ${whats}\nEndereço: ${endereco}\n`;
    msg += `Pagamento: ${pagamento.value.toUpperCase()}\n\n`;
    msg += `ITENS:\n${itens}\n\n`;
    msg += `TOTAL: R$ ${formatarPreco(total)}\n`;
    
    if(pagamento.value == 'pix'){
        msg += `SINAL PAGO: R$ ${formatarPreco(total*0.3)}\n`;
        msg += `Status: Aguardando confirmação do PIX`;
        window.open(`https://wa.me/${NUMERO_PH}?text=${encodeURIComponent(msg)}`);
        alert('Pedido enviado! Assim que o PIX cair o PH entrará em contato.');
    } else {
        msg += `Status: Aguardar contato do PH`;
        window.open(`https://wa.me/${NUMERO_PH}?text=${encodeURIComponent(msg)}`);
    }
    
    carrinho = [];
    atualizarCarrinho();
    fecharCheckout();
}

function trocarAba(aba, btn){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderizarProdutos(aba);
}

// EFEITO PARTICULAS
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
for(let i=0; i<120; i++){ particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2,dx:(Math.random()-0.5)*0.3,dy:(Math.random()-0.5)*0.3}); }
function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{ ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#FFD700';ctx.fill(); p.x+=p.dx;p.y+=p.dy; if(p.x<0||p.x>canvas.width)p.dx*=-1; if(p.y<0||p.y>canvas.height)p.dy*=-1; }); requestAnimationFrame(animate); }
animate();

renderizarProdutos('pronta');
</script>
</body>
</html>
