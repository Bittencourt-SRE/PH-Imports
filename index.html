<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH IMPORTS - iPhones Originais</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background:#000;color:#fff;overflow-x:hidden;}
    
    /* FUNDO VÍDEO ESTÁTUA DA LIBERDADE */
    #video-bg{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }
    /* ESCURECER O VÍDEO PRA DAR CONTRASTE */
    .overlay{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
        z-index: -1;
    }
    
    /* HEADER TOPO */
    header{
        text-align: center;
        padding: 80px 20px 40px 20px;
        background: transparent;
        position: relative;
        z-index: 100;
    }

    /* LETREIRO PH IMPORTS + MAÇÃ */
    .logo-text {
        font-size: 4.5rem;
        font-weight: 900;
        color: #FFD700;
        text-shadow: 0 0 25px rgba(255,215,0,0.9);
        display: inline-flex;
        align-items: center;
        gap: 20px;
        letter-spacing: 5px;
        animation: glowPulse 2s ease-in-out infinite;
    }
    
    /* MAÇÃ MORDIDA DA APPLE EM SVG */
    .apple-icon {
        width: 60px;
        height: 60px;
        fill: #FFD700;
        filter: drop-shadow(0 0 15px rgba(255,215,0,1));
    }

    header p.subtitulo {
        font-size: 1.3rem;
        color: #FFD700;
        font-weight: 600;
        margin-top: 15px;
        text-shadow: 0 0 10px rgba(255,215,0,0.6);
    }
    
    @keyframes glowPulse {
        0%, 100% { text-shadow: 0 0 20px rgba(255,215,0,0.8); }
        50% { text-shadow: 0 0 40px rgba(255,215,0,1); }
    }

    .cart-btn{
        position: fixed;
        top: 20px;
        right: 20px;
        background:#FFD700;
        color:#000;
        padding:12px 20px;
        border-radius:25px;
        border:none;
        cursor:pointer;
        font-weight:bold;
        font-size:14px;
        box-shadow:0 0 15px rgba(255,215,0,0.4);
        transition:0.3s;
        z-index: 101;
    }
    .cart-btn:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(255,215,0,0.7);}
    
    /* PILARES DE CONFIANÇA */
    .pilares{display:flex;flex-direction:column;gap:15px;margin:50px auto;max-width:420px;padding:0 5%;}
    .pilar{
        background:rgba(20,20,20,0.7);
        border:1px solid #FFD700;
        padding:18px 20px;
        border-radius:15px;
        font-weight:600;
        font-size:15px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        backdrop-filter:blur(10px);
        box-shadow:0 0 20px rgba(255,215,0,0.2);
    }
    
    /* ABAS */
    .tabs{display:flex;justify-content:center;gap:15px;margin:30px 5%;flex-wrap:wrap;}
    .tab-btn{padding:12px 25px;background:rgba(0,0,0,0.4);border:2px solid #FFD700;color:#FFD700;border-radius:30px;cursor:pointer;font-weight:bold;transition:0.3s;font-size:14px;backdrop-filter:blur(5px);}
    .tab-btn.active{background:#FFD700;color:#000;box-shadow:0 0 15px rgba(255,215,0,0.5);}
    
    /* PRODUTOS */
    .produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px;padding:0 5% 80px 5%;}
    .card{background:rgba(20,20,20,0.6);border-radius:20px;padding:20px;transition:0.3s;border:1px solid rgba(255,215,0,0.2);backdrop-filter:blur(10px);}
    .card:hover{transform:translateY(-8px);border-color:#FFD700;box-shadow:0 0 30px rgba(255,215,0,0.3);}
    .card img{width:100%;height:220px;object-fit:contain;background:rgba(0,0,0,0.3);border-radius:15px;margin-bottom:15px;padding:10px;}
    .card h3{color:#FFD700;margin-bottom:5px;font-size:20px;}
    .card p{color:#aaa;font-size:14px;margin-bottom:10px;}
    .preco{font-size:26px;font-weight:bold;margin:10px 0;color:#fff;}
    .btn-comprar{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:10px;cursor:pointer;font-weight:bold;font-size:16px;transition:0.2s;}
    .btn-comprar:hover{background:#FFC400;transform:scale(1.02);}
    
    /* WHATS FLUTUANTE */
    .whats{position:fixed;bottom:20px;right:20px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;text-decoration:none;color:#fff;box-shadow:0 0 25px #25D366;z-index:99;}

    @media(max-width: 768px){
        .logo-text{font-size: 2.8rem; letter-spacing: 2px;}
        .apple-icon{width: 40px; height: 40px;}
        header{padding: 60px 20px 30px 20px;}
        .pilar{font-size:14px;}
    }
</style>
</head>
