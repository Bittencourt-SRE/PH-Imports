<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PH IMPORTS - Apple Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  max-width: 100vw;
  overflow-x: hidden; /* TRAVA O LADO */
}
:root {
  --bg: #000;
  --card: #111;
  --gold: #d4a017;
  --text: #fff;
  --text2: #aaa;
}
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* HEADER FIXO */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  max-width: 1400px; /* LARGURA FIXA */
  margin: 0 auto;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  border-bottom: 1px solid #222;
}
.logo { font-size: 24px; font-weight: 800; color: var(--gold); letter-spacing: 2px; }

/* MENU LATERAL PEQUENO - ESTILO PH BARBEARIA */
.menu-btn { background: none; border: none; cursor: pointer; }
.menu-btn div { width: 28px; height: 3px; background: var(--gold); margin: 5px 0; border-radius: 2px; }

.sidebar {
  position: fixed; top: 0; right: -300px; /* ERA 400, AGORA 300 */
  width: 280px; height: 100%; /* MENOR */
  background: #0a0a0a; transition: 0.3s;
  padding-top: 80px; z-index: 200;
  border-left: 2px solid var(--gold);
  box-shadow: -5px 0 20px rgba(0,0,0,0.5);
}
.sidebar.active { right: 0; }
.sidebar a {
  display: block; padding: 16px 25px;
  color: #fff; text-decoration: none;
  font-size: 16px; font-weight: 600; /* ERA 18px */
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: 0.2s;
}
.sidebar a:hover { background: #1a1a1a; padding-left: 30px; color: var(--gold); }
.close-btn {
  position: absolute; top: 15px; right: 20px;
  font-size: 28px; background: none; border: none;
  color: var(--gold); cursor: pointer;
}

/* CARRINHO NO HEADER */
.btn-carrinho {
  position: relative;
  background: var(--gold);
  color: #000;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: 700;
  border: none;
  cursor: pointer;
}
.carrinho-contador {
  position: absolute; top: -5px; right: -5px;
  background: red; color: #fff; border-radius: 50%;
  width: 20px; height: 20px; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}

/* CONTAINER COM LARGURA MAXIMA */
.container,.hero-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 5%;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?q=80&w=2070') center/cover;
  padding-top: 80px;
}
.hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; background: linear-gradient(90deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { font-size: 1.2rem; color: var(--text2); margin: 20px 0 30px; }

/* RESTO IGUAL... grid-produtos, carrinho, modal... */

.grid-produtos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; padding: 100px 0; }
.card-produto {
  background: var(--card); border-radius: 20px; padding: 20px;
  border: 1px solid #222; transition: 0.4s;
}
.card-produto:hover { transform: translateY(-10px); border-color: var(--gold); }
.card-produto img { width: 100%; height: 220px; object-fit: cover; border-radius: 15px; margin-bottom: 15px; }
.preco { color: var(--gold); font-size: 1.5rem; font-weight: 800; margin: 10px 0; }
.botoes-produto { display: flex; gap: 10px; }
.btn-carrinho-add,.btn-comprar {
  flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none;
}
.btn-carrinho-add { background: #333; color: #fff; }
.btn-comprar { background: var(--gold); color: #000; }

/* CARRINHO LATERAL */
.carrinho-sidebar {
  position: fixed; top: 0; right: -380px;
  width: 360px; height: 100%; /* TAMBEM MENOR */
  background: #0a0a0a; z-index: 201; transition: 0.3s;
  padding: 20px; border-left: 2px solid var(--gold);
}
.carrinho-sidebar.active { right: 0; }

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 300; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content {
  background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 500px;
  border: 1px solid var(--gold);
}
</style>
</head>
<body>

<header>

  <button style="width:100%; background:var(--gold); color:#000; padding:15px; border:none; border-radius:10px; font-weight:800;" onclick="abrirCheckout()">Finalizar Pedido</button>

<section class="hero">

<section class="container" id="produtos">

<div class="modal" id="modalCheckout">

    <input type="datetime-local" id="dataEntrega" style="width:100%; padding:12px; margin:8px 0; background:#222; border:1px solid #333; border-radius:8px; color:#fff;">
    <select id="pagamento" style="width:100%; padding:12px; margin:8px 0; background:#222; border:1px solid #333; border-radius:8px; color:#fff;">
      <option value="PIX">PIX</option>
      <option value="Cartão">Cartão na entrega</option>
      <option value="Dinheiro">Dinheiro na entrega</option>
    </select>
    <button style="width:100%; background:var(--gold); color:#000; padding:15px; border:none; border-radius:10px; font-weight:800; margin-top:10px;" onclick="enviarPedido()">Enviar Pedido via WhatsApp</button>
    <button style="width:100%; margin-top:10px; background:#333; color:#fff; padding:12px; border:none; border-radius:10px;" onclick="fecharCheckout()">Cancelar</button>
  </div>
</div>

</body>
</html>
