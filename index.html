<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Imports - iPhones Originais com Garantia</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background:#000;color:#fff;overflow-x:hidden;}
    
    /* FUNDO GALAXIA */
    #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 50% 50%, #05051a 0%, #000 100%);}
    
    /* HEADER FIXO NO TOPO, SEM FUNDO - LOGO CENTRALIZADA */
    header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:20px 5% 10px 5%; /* 20px em cima pra não grudar */
        background:transparent;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        z-index:100;
    }

    /* LOGO CENTRALIZADA E MENOR */
    .logo-svg {
        width: 160px; /* diminui um pouco */
        height: auto;
        animation: glowPulse 2s ease-in-out infinite;
        position: absolute;
        left: 50%;
        transform: translateX(-50%); /* trava no centro exato */
    }
    .logo-svg svg {
        width: 100%;
        height: auto;
    }
    @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(255,215,0,0.6)); }
        50% { filter: drop-shadow(0 0 20px rgba(255,215,0,1)); }
    }

    .cart-btn{
        background:#FFD700;
        color:#000;
        padding:10px 18px;
        border-radius:25px;
        border:none;
        cursor:pointer;
        font-weight:bold;
        font-size:14px;
        box-shadow:0 0 15px rgba(255,215,0,0.4);
        transition:0.3s;
        margin-left: auto; /* joga pra direita */
        position: relative;
        z-index: 101;
    }
    .cart-btn:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(255,215,0,0.7);}
    
    /* BANNER COM IMAGEM - DESCEU PRA NÃO FICAR ATRÁS DA LOGO */
    .banner-hero {
        width: 100%;
        height: 45vh;
        background-image: url('banner_ph_imports.jpg');
        background-size: cover;
        background-position: center;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 110px; /* era 70px, aumentei */
    }
    .banner-hero::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.8));
    }
    
    /* PILARES */
    .pilares{display:flex;flex-direction:column;gap:15px;margin:30px auto;max-width:400px;padding:0 5%;}
    .pilar{
        background:rgba(20,20,20,0.6);
        border:1px solid #FFD700;
        padding:18px 20px;
        border-radius:15px;
        font-weight:600;
        font-size:15px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        backdrop-filter:blur(5px);
        box-shadow:0 0 15px rgba(255,215,0,0.1);
    }
    
    /* ABAS */
    .tabs{display:flex;justify-content:center;gap:15px;margin:30px 5%;flex-wrap:wrap;}
    .tab-btn{padding:12px 25px;background:transparent;border:2px solid #FFD700;color:#FFD700;border-radius:30px;cursor:pointer;font-weight:bold;transition:0.3s;font-size:14px;}
    .tab-btn.active{background:#FFD700;color:#000;}
    
    /* PRODUTOS */
    .produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:0 5% 80px 5%;}
    .card{background:rgba(255,255,255,0.05);border-radius:20px;padding:20px;transition:0.3s;border:1px solid rgba(255,215,0,0.2);position:relative;}
    .card:hover{transform:translateY(-8px);border-color:#FFD700;box-shadow:0 0 25px rgba(255,215,0,0.3);}
    .card img{width:100%;height:220px;object-fit:contain;background:rgba(0,0,0,0.3);border-radius:15px;margin-bottom:15px;padding:10px;}
    .card h3{color:#FFD700;margin-bottom:5px;font-size:20px;}
    .card p{color:#aaa;font-size:14px;margin-bottom:10px;}
    .preco{font-size:24px;font-weight:bold;margin:10px 0;color:#fff;}
    .btn-comprar{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:10px;cursor:pointer;font-weight:bold;font-size:16px;transition:0.2s;}
    .btn-comprar:hover{background:#FFC400;}
    
    /* WHATS FLUTUANTE */
    .whats{position:fixed;bottom:20px;right:20px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;text-decoration:none;color:#fff;box-shadow:0 0 25px #25D366;z-index:99;}

    @media(max-width: 768px){
        .logo-svg{width:130px;} /* menor no mobile */
        .banner-hero{height: 35vh; margin-top: 100px;}
        .pilar{font-size:14px;}
        header{padding:15px 5%;}
    }
</style>
</head>
<body>
<canvas id="particles"></canvas>

<header>
    <!-- LOGO VIA CÓDIGO - CENTRALIZADA -->
    <div class="logo-svg">
        <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
                </linearGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <!-- PH -->
            <text x="50%" y="60%" text-anchor="middle" font-family="serif" font-size="120" font-weight="900" font-style="italic" fill="url(#gold)" filter="url(#glow)">PH</text>
            
            <!-- Maçã -->
            <g transform="translate(275, 52) scale(0.75)">
                <path d="M 50 10 C 40 5, 25 0, 15 10 C 5 20, 5 35, 15 45 C 25 55, 40 60, 50 55 C 60 50, 65 35, 55 25 C 65 15, 60 5, 50 10 Z" fill="url(#gold)"/>
                <path d="M 50 5 C 52 2, 55 0, 58 2 C 60 4, 59 7, 57 8" fill="url(#gold)"/>
            </g>
            
            <!-- IMPORTS -->
            <text x="50%" y="85%" text-anchor="middle" font-family="Arial Black" font-size="28" letter-spacing="8" fill="url(#gold)" filter="url(#glow)">IMPORTS</text>
            
            <!-- Linha -->
            <line x1="80" y1="145" x2="320" y2="145" stroke="url(#gold)" stroke-width="2"/>
        </svg>
    </div>
    
    <button class="cart-btn">Carrinho (0)</button>
</header>

<!-- BANNER COM A FOTO -->
<section class="banner-hero"></section>

<section style="padding:0 5%;">
    <div class="pilares">
        <div class="pilar">🛡️ Garantia de 90 dias</div>
        <div class="pilar">✅ 100% Original Lacrado</div>
        <div class="pilar">💰 Pague só quando receber</div>
    </div>
</section>

<div class="tabs">
    <button class="tab-btn active">Pronta Entrega</button>
    <button class="tab-btn">Encomenda 30%</button>
</div>

<section class="produtos" id="produtos"></section>

<a href="https://wa.me/5551984254783" class="whats" target="_blank">💬</a>

<script>
// EFEITO PARTICULAS DOURADAS
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
for(let i=0; i<120; i++){ particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2,dx:(Math.random()-0.5)*0.3,dy:(Math.random()-0.5)*0.3}); }
function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{ ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#FFD700';ctx.fill(); p.x+=p.dx;p.y+=p.dy; if(p.x<0||p.x>canvas.width)p.dx*=-1; if(p.y<0||p.y>canvas.height)p.dy*=-1; }); requestAnimationFrame(animate); }
animate();

// AQUI DEPOIS A GENTE COLOCA: PUXAR PRODUTOS DA PLANILHA + CARRINHO
</script>
</body>
</html>
