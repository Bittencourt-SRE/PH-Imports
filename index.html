<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Imports - iPhones Originais com Garantia</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background:#000;color:#fff;overflow-x:hidden;}
    
    /* FUNDO GALAXIA */
    #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 50% 50%, #0a0a2a 0%, #000 100%);}
    
    /* HEADER */
    header{display:flex;justify-content:space-between;align-items:center;padding:20px 5%;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
    .logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:bold;color:#FFD700;}
    .logo img{height:40px;filter:drop-shadow(0 0 5px #FFD700);}
    .cart-btn{background:#FFD700;color:#000;padding:10px 20px;border-radius:25px;border:none;cursor:pointer;font-weight:bold;}
    
    /* BANNER */
    .banner{text-align:center;padding:100px 5%;}
    .banner h1{font-size:48px;margin-bottom:20px;text-shadow:0 0 20px #FFD700;}
    .banner p{font-size:18px;margin-bottom:30px;color:#ccc;}
    .pilares{display:flex;justify-content:center;gap:30px;margin-top:40px;flex-wrap:wrap;}
    .pilar{background:rgba(255,215,0,0.1);border:1px solid #FFD700;padding:20px;border-radius:15px;width:250px;}
    
    /* ABAS */
    .tabs{display:flex;justify-content:center;gap:20px;margin:40px 0;}
    .tab-btn{padding:15px 40px;background:transparent;border:2px solid #FFD700;color:#FFD700;border-radius:30px;cursor:pointer;font-weight:bold;transition:0.3s;}
    .tab-btn.active{background:#FFD700;color:#000;}
    
    /* PRODUTOS */
    .produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px;padding:0 5%;}
    .card{background:rgba(255,255,255,0.05);border-radius:20px;padding:20px;transition:0.3s;border:1px solid transparent;}
    .card:hover{transform:translateY(-5px);border-color:#FFD700;}
    .card img{width:100%;border-radius:15px;margin-bottom:15px;}
    .card h3{color:#FFD700;margin-bottom:5px;}
    .preco{font-size:22px;font-weight:bold;margin:10px 0;}
    .btn-comprar{width:100%;padding:12px;background:#FFD700;color:#000;border:none;border-radius:10px;cursor:pointer;font-weight:bold;}
    
    /* WHATS FLUTUANTE */
    .whats{position:fixed;bottom:20px;right:20px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none;color:#fff;box-shadow:0 0 20px #25D366;}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<header>
    <div class="logo">
        <img src="LOGO_PH.png" alt="PH Imports">
        PH IMPORTS
    </div>
    <button class="cart-btn">Carrinho (0)</button>
</header>

<section class="banner">
    <h1>iPhones Originais com Garantia</h1>
    <p>100% Lacrado | Pague na Entrega | 90 Dias de Garantia</p>
    <div class="pilares">
        <div class="pilar">🛡️ Garantia de 90 dias</div>
        <div class="pilar">✅ 100% Original Lacrado</div>
        <div class="pilar">💰 Pague só quando receber</div>
    </div>
</section>

<div class="tabs">
    <button class="tab-btn active" onclick="trocarAba('pronta')">Pronta Entrega</button>
    <button class="tab-btn" onclick="trocarAba('encomenda')">Encomenda 30%</button>
</div>

<section class="produtos" id="produtos">
    <!-- PRODUTOS EXEMPLO - DEPOIS VEM DA PLANILHA -->
    <div class="card">
        <img src="https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-15-pro-finish-select-202309-6-1inch-naturaltitanium?wid=2560&hei=1440&fmt=pjpg" alt="iPhone 15 Pro Max">
        <h3>iPhone 15 Pro Max</h3>
        <p>256GB - Titânio Natural</p>
        <div class="preco">R$ 5.900</div>
        <button class="btn-comprar" onclick="encomendar('iPhone 15 Pro Max 256GB')">Encomendar com 30%</button>
    </div>
    <div class="card">
        <img src="https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-14-finish-select-202209-6-1inch-blue?wid=2560&hei=1440&fmt=pjpg" alt="iPhone 14">
        <h3>iPhone 14</h3>
        <p>128GB - Azul</p>
        <div class="preco">R$ 3.800</div>
        <button class="btn-comprar" onclick="comprar('iPhone 14 128GB')">Comprar Agora</button>
    </div>
</section>

<a href="https://wa.me/5551984254783" class="whats" target="_blank">💬</a>

<script>
// EFEITO PARTICULAS GALAXIA
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];
for(let i=0; i<100; i++){
    particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2,dx:(Math.random()-0.5)*0.5,dy:(Math.random()-0.5)*0.5});
}
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#FFD700';ctx.fill();
        p.x+=p.dx;p.y+=p.dy;
        if(p.x<0||p.x>canvas.width)p.dx*=-1;
        if(p.y<0||p.y>canvas.height)p.dy*=-1;
    });
    requestAnimationFrame(animate);
}
animate();

// FUNÇÕES
function encomendar(produto){
    let msg = `Olá PH! Quero ENCOMENDAR: ${produto}%0AQuero pagar 30% de sinal. Me passa os dados?`;
    window.open(`https://wa.me/5551984254783?text=${msg}`);
}
function comprar(produto){
    let msg = `Olá PH! Quero COMPRAR: ${produto}%0AForma de pagamento: Pix ou na Entrega`;
    window.open(`https://wa.me/5551984254783?text=${msg}`);
}
function trocarAba(aba){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    // Aqui depois a gente filtra os produtos da planilha
}
</script>
</body>
</html>
