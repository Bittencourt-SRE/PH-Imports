<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Imports</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background:#000;color:#fff;overflow-x:hidden;}
    
    #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 50% 50%, #05051a 0%, #000 100%);}
    
    /* HEADER TODO BRANCO COM LOGO MAIOR */
    header{display:flex;justify-content:center;align-items:center;padding:0;background:#fff;position:sticky;top:0;z-index:100;border-bottom:3px solid #FFD700;min-height:150px;} /* altura maior */
    .logo{width:100%;text-align:center;}
    .logo img{width:90%;max-width:400px;height:auto;object-fit:contain;padding:20px 0;} /* expandiu mais */
    .cart-btn{position:absolute;right:5%;top:50%;transform:translateY(-50%);background:#FFD700;color:#000;padding:8.5px 17px; /* -15% */ border-radius:25px;border:none;cursor:pointer;font-weight:bold;font-size:12px; /* -15% */ display:flex;gap:6px;align-items:center;}
    
    .banner{text-align:center;padding:40px 5% 30px 5%;}
    .pilares{display:flex;flex-direction:column;gap:15px;max-width:400px;margin:0 auto;}
    .pilar{background:rgba(20,20,20,0.6);border:1px solid #FFD700;padding:18px 20px;border-radius:15px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(5px);}
    
    .tabs{display:flex;justify-content:center;gap:15px;margin:30px 5%;flex-wrap:wrap;}
    .tab-btn{padding:12px 25px;background:transparent;border:2px solid #FFD700;color:#FFD700;border-radius:30px;cursor:pointer;font-weight:bold;transition:0.3s;font-size:14px;}
    .tab-btn.active{background:#FFD700;color:#000;}
    
    .produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:0 5% 80px 5%;}
    .card{background:rgba(255,255,255,0.05);border-radius:20px;padding:20px;transition:0.3s;border:1px solid rgba(255,215,0,0.2);}
    .card:hover{transform:translateY(-8px);border-color:#FFD700;box-shadow:0 0 25px rgba(255,215,0,0.3);}
    .card img{width:100%;height:220px;object-fit:contain;background:rgba(0,0,0,0.3);border-radius:15px;margin-bottom:15px;padding:10px;}
    .card h3{color:#FFD700;margin-bottom:5px;font-size:20px;}
    .card p{color:#aaa;font-size:14px;margin-bottom:10px;}
    .preco{font-size:24px;font-weight:bold;margin:10px 0;color:#fff;}
    .btns-card{display:flex;gap:10px;}
    .btn-comprar, .btn-add{flex:1;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;font-size:14px;}
    .btn-comprar{background:#FFD700;color:#000;}
    .btn-add{background:transparent;color:#FFD700;border:2px solid #FFD700;}
    
    /* MODAL CARRINHO - MENOS DE MEIA TELA + X ESQUERDA */
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:200;}
    .modal-content{background:#111;margin:0 auto;padding:20px;border-radius:20px 20px 0 0;border:2px solid #FFD700;border-bottom:none;position:absolute;bottom:0;width:100%;max-height:40vh;overflow-y:auto;} /* 40% da tela */
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;position:relative;}
    .modal-header h2{color:#FFD700;font-size:20px;margin:0 auto;}
    .btn-x{position:absolute;left:0;top:0;background:none;border:none;color:#FFD700;font-size:32px;cursor:pointer;line-height:1;padding:0;}
    .item-carrinho{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:12px;background:rgba(255,255,255,0.05);border-radius:10px;}
    .item-info{flex:1;}
    .item-info h4{color:#FFD700;font-size:14px;}
    .item-info p{color:#aaa;font-size:12px;}
    .qtd{display:flex;gap:8px;align-items:center;}
    .qtd button{background:#FFD700;color:#000;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-weight:bold;font-size:16px;}
    .total{font-size:22px;font-weight:bold;color:#FFD700;text-align:right;margin:20px 0;border-top:1px solid #FFD700;padding-top:15px;}
    .btn-finalizar, .btn-continuar, .btn-esvaziar{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer;}
    .btn-finalizar{background:#FFD700;color:#000;}
    .btn-continuar{background:transparent;color:#FFD700;border:2px solid #FFD700;}
    .btn-esvaziar{background:#800;color:#fff;}
    
    .whats{position:fixed;bottom:20px;right:20px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;text-decoration:none;color:#fff;box-shadow:0 0 25px #25D366;z-index:99;}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<header>
    <div class="logo">
        <img src="/mnt/data/wa_image_5780872385356168928" alt="PH Imports"> <!-- Logo que tu mandou -->
    </div>
    <button class="cart-btn" onclick="abrirCarrinho()">🛒 Carrinho (<span id="qtd-carrinho">0</span>)</button>
</header>

<section class="banner">
    <div class="pilares">
        <div class="pilar">📦 Produtos de procedência</div>
        <div class="pilar">💳 Pix, boleto e cartão</div>
        <div class="pilar">🚚 Entrega segura</div>
    </div>
</section>

<div class="tabs">
    <button class="tab-btn active" onclick="trocarAba('pronta', this)">Pronta Entrega</button>
    <button class="tab-btn" onclick="trocarAba('encomenda', this)">Encomenda 30%</button>
</div>

<section class="produtos" id="produtos"></section>

<a href="https://wa.me/5551995702188" class="whats" target="_blank">💬</a>

<!-- MODAL CARRINHO -->
<div id="modal-carrinho" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <button class="btn-x" onclick="fecharCarrinho()">×</button> <!-- X na esquerda -->
            <h2>🛒 Seu Carrinho</h2>
        </div>
        <div id="lista-carrinho"></div>
        <div class="total">Total: R$ <span id="total-carrinho">0,00</span></div>
        <button class="btn-finalizar" onclick="finalizarWhatsApp()">🛒 Finalizar no WhatsApp 🛒</button>
        <button class="btn-continuar" onclick="fecharCarrinho()">Continuar Comprando</button>
        <button class="btn-esvaziar" onclick="esvaziarCarrinho()">Esvaziar Carrinho</button>
    </div>
</div>

<script>
let carrinho = [];
let numeroPedido = parseInt(localStorage.getItem('numeroPedido') || '1');
const NUMERO_PH = "5551995702188";

const produtos = [
    {nome:'iPhone TESTE', desc:'R$ 0,10 - Para teste', preco:0.10, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-15-pro-finish-select-202309-6-1inch-naturaltitanium?wid=5120&fmt=pjpg', tipo:'pronta'},
    {nome:'iPhone TESTE ENCOMENDA', desc:'R$ 0,10 - Para teste 30%', preco:0.10, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-16-pro-finish-select-202409-6-1inch-deserttitanium?wid=5120&fmt=pjpg', tipo:'encomenda'},
    {nome:'iPhone 15 Pro Max', desc:'512GB - Titânio Natural', preco:7200, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-15-pro-finish-select-202309-6-1inch-naturaltitanium?wid=5120&fmt=pjpg', tipo:'pronta'},
    {nome:'iPhone 16 Pro Max', desc:'1TB - Titânio Deserto', preco:8500, img:'https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-16-pro-finish-select-202409-6-1inch-deserttitanium?wid=5120&fmt=pjpg', tipo:'encomenda'},
];

function formatarPreco(valor){ return valor.toLocaleString('pt-BR', {minimumFractionDigits: 2}); }

function renderizarProdutos(tipo){
    const container = document.getElementById('produtos');
    container.innerHTML = '';
    produtos.filter(p => p.tipo == tipo).forEach(p=>{
        const btnTexto = tipo=='encomenda' ? 'Encomendar 30%' : 'Comprar Agora';
        container.innerHTML += `
        <div class="card">
            <img src="${p.img}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <p>${p.desc}</p>
            <div class="preco">R$ ${formatarPreco(p.preco)}</div>
            <div class="btns-card">
                <button class="btn-comprar" onclick="comprarDireto('${p.nome}', '${p.desc}', ${p.preco})">${btnTexto}</button>
                <button class="btn-add" onclick="adicionarCarrinho('${p.nome}', '${p.desc}', ${p.preco})">Add Carrinho</button>
            </div>
        </div>`;
    });
}

function comprarDireto(nome, desc, preco){
    carrinho = [{nome, desc, preco, qtd:1}];
    atualizarCarrinho();
    finalizarWhatsApp();
}

function adicionarCarrinho(nome, desc, preco){
    const item = carrinho.find(i => i.nome == nome);
    if(item){ item.qtd++; } 
    else { carrinho.push({nome, desc, preco, qtd:1}); }
    atualizarCarrinho();
    abrirCarrinho();
}

function removerCarrinho(nome){
    const item = carrinho.find(i => i.nome == nome);
    if(item.qtd > 1){ item.qtd--; } 
    else { carrinho = carrinho.filter(i => i.nome != nome); }
    atualizarCarrinho();
}

function esvaziarCarrinho(){
    carrinho = [];
    atualizarCarrinho();
}

function atualizarCarrinho(){
    document.getElementById('qtd-carrinho').innerText = carrinho.reduce((t,i)=>t+i.qtd,0);
    const lista = document.getElementById('lista-carrinho');
    lista.innerHTML = '';
    let total = 0;
    carrinho.forEach(i=>{
        total += i.preco * i.qtd;
        lista.innerHTML += `
        <div class="item-carrinho">
            <div class="item-info">
                <h4>${i.nome}</h4>
                <p>R$ ${formatarPreco(i.preco)} x ${i.qtd}</p>
            </div>
            <div class="qtd">
                <button onclick="removerCarrinho('${i.nome}')">-</button>
                <span>${i.qtd}</span>
                <button onclick="adicionarCarrinho('${i.nome}', '${i.desc}', ${i.preco})">+</button>
            </div>
        </div>`;
    });
    document.getElementById('total-carrinho').innerText = formatarPreco(total);
}

function abrirCarrinho(){ document.getElementById('modal-carrinho').style.display='block'; }
function fecharCarrinho(){ document.getElementById('modal-carrinho').style.display='none'; }

function finalizarWhatsApp(){
    if(carrinho.length==0){ alert('Carrinho vazio'); return; }
    const total = carrinho.reduce((t,i)=>t+i.preco*i.qtd,0);
    const itens = carrinho.map(i=>`${i.nome} - ${i.qtd}x R$${formatarPreco(i.preco)}`).join('\n');
    const pedidoNum = numeroPedido;
    numeroPedido++;
    localStorage.setItem('numeroPedido', numeroPedido);
    
    let msg = `🛒 PEDIDO Nº ${pedidoNum} 🛒\n\nITENS:\n${itens}\n\nTOTAL: R$ ${formatarPreco(total)}`;
    window.open(`https://wa.me/${NUMERO_PH}?text=${encodeURIComponent(msg)}`);
    carrinho = [];
    atualizarCarrinho();
    fecharCarrinho();
}

function trocarAba(aba, btn){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderizarProdutos(aba);
}

// PARTICULAS
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
for(let i=0; i<120; i++){ particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2,dx:(Math.random()-0.5)*0.3,dy:(Math.random()-0.5)*0.3}); }
function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{ ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#FFD700';ctx.fill(); p.x+=p.dx;p.y+=p.dy; if(p.x<0||p.x>canvas.width)p.dx*=-1; if(p.y<0||p.y>canvas.height)p.dy*=-1; }); requestAnimationFrame(animate); }
animate();

renderizarProdutos('pronta');
</script>
</body>
</html>
